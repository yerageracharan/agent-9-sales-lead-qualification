name: Design quality checks

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "DESIGN.md"
      - "scripts/design-guard.mjs"
      - "tests/site-smoke.mjs"
      - ".github/workflows/design-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "DESIGN.md"
      - "scripts/design-guard.mjs"
      - "tests/site-smoke.mjs"
      - ".github/workflows/design-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest visual review for a branch/ref.
concurrency:
  group: design-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run site for rendered inspection
        run: |
          python3 -m http.server 4173 --directory site >/tmp/fieldwork-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx --yes impeccable detect http://127.0.0.1:4173/
      - name: Check the design contract
        run: node scripts/design-guard.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the five walkthroughs
        run: node tests/site-smoke.mjs
      - name: Upload mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-design-review
          path: artifacts/design-review/*.png
          if-no-files-found: ignore
